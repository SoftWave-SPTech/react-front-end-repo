name: Deploy Frontend

on:
  push:
    branches: ["release/sprint-5"]
  pull_request:
    branches: ["release/sprint-5"]

env:
  FRONT_IMG: ${{ secrets.DOCKERHUB_USERNAME }}/react-front-end-repo:latest

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Render api.js (inject EC2 host)
        env:
          EC2_HOST_PUBLIC: ${{ secrets.EC2_HOST_PUBLIC }}
        run: |
          TEMPLATE="src/service/api.js"
          OUT="src/service/api.js"
      
          if [ -z "${EC2_HOST_PUBLIC:-}" ]; then
            echo "::error::EC2_HOST_PUBLIC is empty. Make sure the secret exists."
            exit 1
          fi
      
          if [ ! -f "$TEMPLATE" ]; then
            echo "::error::Template not found at $TEMPLATE"
            ls -R | sed -n '1,200p'
            exit 1
          fi
      
          # renderiza substituindo $EC2_HOST_PUBLIC
          envsubst '${EC2_HOST_PUBLIC}' < "$TEMPLATE" > "${OUT}.rendered"
          mv "${OUT}.rendered" "$OUT"
          echo "Rendered $OUT (head):"
          sed -n '1,120p' "$OUT"


      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ env.FRONT_IMG }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy frontend on EC2_A
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.EC2_IP_A }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin <<< "${{ secrets.DOCKERHUB_TOKEN }}"
            docker pull "${{ env.FRONT_IMG }}"
            docker stop frontend || true
            docker rm frontend || true
            docker run -d --name frontend -p 8080:80 --restart unless-stopped "${{ env.FRONT_IMG }}"
            docker ps --filter "name=frontend"

      - name: Deploy frontend on EC2_B
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.EC2_IP_B }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin <<< "${{ secrets.DOCKERHUB_TOKEN }}"
            docker pull "${{ env.FRONT_IMG }}"
            docker stop frontend || true
            docker rm frontend || true
            docker run -d --name frontend -p 8080:80 --restart unless-stopped "${{ env.FRONT_IMG }}"
            docker ps --filter "name=frontend"
